<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Steps - English for Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* RESET & BASE (Section 1) */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #EBF3FA; /* Soft pastel letterbox background */
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      color: #2B2A4C;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: 700;
      line-height: 1.15;
    }

    /* 1920x1080 FIXED STAGE (Section 1) */
    #stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage {
      position: absolute;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      background: #FAFCFF;
      overflow: hidden;
    }

    /* THEME COLOR TOKENS */
    :root {
      --color-explore: #CFF3E3;
      --color-explore-border: #80E5B6;
      --color-learn: #D9E4FF;
      --color-learn-border: #99B8FF;
      --color-play: #FFE0CC;
      --color-play-border: #FFB380;
      --color-review: #FFF3C4;
      --color-review-border: #FFE270;
      --color-primary: #4B44C9;
      --color-primary-hover: #3D36B5;
      --color-text: #2B2A4C;
      --color-text-muted: #5E5D80;
      --color-gold: #FFB800;
      --color-green: #10B981;
    }

    /* SHARED COMPONENTS (Section 1 Sizes: Button h96, r48, touch>=96x96, text>=28px) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 96px;
      min-width: 96px;
      padding: 0 44px;
      border-radius: 48px;
      border: none;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 32px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 10px 0 #2A2580, 0 14px 25px rgba(43,42,76,0.18);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 13px 0 #2A2580, 0 18px 28px rgba(43,42,76,0.22);
    }
    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #2A2580, 0 8px 12px rgba(43,42,76,0.15);
    }

    .btn-primary {
      background: var(--color-primary);
      color: #FFFFFF;
    }
    .btn-secondary {
      background: #FFFFFF;
      color: var(--color-text);
      box-shadow: 0 10px 0 #CAD2DE, 0 14px 25px rgba(43,42,76,0.12);
      border: 4px solid #DFE5EF;
    }
    .btn-secondary:hover {
      box-shadow: 0 13px 0 #CAD2DE, 0 18px 28px rgba(43,42,76,0.16);
    }
    .btn-secondary:active {
      box-shadow: 0 4px 0 #CAD2DE;
    }

    .btn-icon-sq {
      width: 96px;
      height: 96px;
      padding: 0;
      border-radius: 48px;
      font-size: 38px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 32px;
      border: 4px solid #E8EEF8;
      box-shadow: 0 12px 30px rgba(43,42,76,0.06);
      position: relative;
    }

    /* HEADER (120px) & FOOTER (140px) */
    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 120px;
      padding: 12px 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 4px solid #EAEFF8;
      z-index: 100;
    }

    .app-content {
      position: absolute;
      top: 120px;
      left: 96px;
      width: 1728px;
      height: 820px;
      overflow: hidden;
    }

    .app-footer {
      position: absolute;
      top: 940px;
      left: 0;
      width: 1920px;
      height: 140px;
      padding: 22px 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.95);
      border-top: 4px solid #EAEFF8;
      z-index: 100;
    }

    /* PROGRESS BAR */
    .progress-bar-wrap {
      width: 480px;
      height: 40px;
      background: #E8EEF8;
      border-radius: 20px;
      border: 3px solid #D6E0F0;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10B981, #34D399);
      border-radius: 17px;
      transition: width 0.3s ease;
    }

    /* FIXED-HEIGHT FEEDBACK SLOT (CLS = 0, no red, green/gold only) */
    .feedback-slot {
      height: 80px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feedback-msg {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 34px;
      font-weight: 700;
      padding: 10px 36px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      animation: popBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .feedback-correct {
      background: #D1FAE5;
      color: #065F46;
      border: 3px solid #6EE7B7;
    }
    .feedback-wrong {
      background: #FEF3C7;
      color: #92400E;
      border: 3px solid #FCD34D;
    }

    /* TOAST (Gentle notifications) */
    #toast {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      background: #2B2A4C;
      color: #FFFFFF;
      padding: 20px 48px;
      border-radius: 40px;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 16px 36px rgba(0,0,0,0.2);
      z-index: 1000;
      display: none;
      animation: toastPop 0.3s ease;
      border: 4px solid #E6DCFF;
    }

    /* MODAL OVERLAY */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background: rgba(43, 42, 76, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
    }
    .modal-box {
      width: 900px;
      background: #FFFFFF;
      border-radius: 40px;
      border: 6px solid #D9E4FF;
      padding: 56px 64px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      animation: popBounce 0.35s ease;
    }

    /* ANIMATIONS */
    @keyframes popBounce {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes toastPop {
      0% { transform: translate(-50%, -20px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }
    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes gentleWobble {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .pulse-anim { animation: softPulse 1.8s infinite ease-in-out; }
    .wobble-anim { animation: gentleWobble 0.4s ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      *, .btn, .pulse-anim, .wobble-anim {
        animation: none !important;
        transition: none !important;
      }
    }

    /* DEBUG PANEL (Section 9) */
    #debug-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1E1B4B;
      color: #FFFFFF;
      padding: 16px 24px;
      border-radius: 20px;
      z-index: 9999;
      font-family: monospace;
      font-size: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      max-height: 80vh;
      overflow: hidden;
      border: 3px solid #6366F1;
    }
    #debug-panel button {
      background: #4F46E5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px 4px 4px 0;
    }
    #debug-panel button:hover { background: #4338CA; }
    #debug-table {
      margin-top: 12px;
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    #debug-table th, #debug-table td {
      border: 1px solid #4338CA;
      padding: 6px 10px;
      text-align: left;
    }
    #debug-table th { background: #312E81; }
    .badge-pass { color: #34D399; font-weight: bold; }
    .badge-fail { color: #F87171; font-weight: bold; }
  </style>
</head>
<body>

<div id="stage-container">
  <div id="stage">
    <!-- Dynamic Header -->
    <header class="app-header" id="app-header">
      <!-- Injected by router/renderer -->
    </header>

    <!-- Main Content Area: 1728 x 820px, zero scroll -->
    <main class="app-content" id="app-content">
      <!-- Injected by router/renderer -->
    </main>

    <!-- Dynamic Footer -->
    <footer class="app-footer" id="app-footer">
      <!-- Injected by router/renderer -->
    </footer>

    <!-- Toast Component -->
    <div id="toast"></div>

    <!-- Modal Container -->
    <div id="modal-root"></div>
  </div>
</div>

<!-- Floating Debug Panel (Activated via ?debug=1) -->
<div id="debug-panel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <strong>Layout & Audit Suite (?debug=1)</strong>
    <button onclick="document.getElementById('debug-panel').style.display='none'">✕</button>
  </div>
  <div>
    <button onclick="runLayoutAuditCurrent()">Audit Current Screen</button>
    <button onclick="runAllScreensAudit()">Run Full Test Suite</button>
    <button onclick="resetDemoSeed()">Reset Seed (65%)</button>
  </div>
  <div id="debug-results"></div>
</div>

<script>
/**
 * SECTION 4: DATA MODEL (Cambridge Little Steps Inspired)
 */
const DATA = {
  unit1: {
    id: 'unit1',
    number: 1,
    name: 'School',
    bigQuestion: 'What Do We Do at School?',
    description: 'Explore our friendly classroom, discover school items, and meet friends!',
    words: [
      { id: 'w1', english: 'Teacher', emoji: '👩‍🏫', phrase: 'This is a teacher.' },
      { id: 'w2', english: 'Student', emoji: '🧒', phrase: 'This is a student.' },
      { id: 'w3', english: 'Book', emoji: '📖', phrase: 'This is a book.' },
      { id: 'w4', english: 'Classroom', emoji: '🏫', phrase: 'This is a classroom.' },
      { id: 'w5', english: 'Desk', emoji: '🪑', phrase: 'This is a desk.' },
      { id: 'w6', english: 'School', emoji: '🎒', phrase: 'This is a school.' }
    ]
  },
  pets: {
    id: 'pets',
    number: 'Starter',
    name: 'Pets',
    bigQuestion: 'Who Are Our Animal Friends?',
    description: 'Cute animal companions at home!',
    words: [
      { id: 'p1', english: 'Cat', emoji: '🐱', phrase: 'This is a cat.' },
      { id: 'p2', english: 'Dog', emoji: '🐶', phrase: 'This is a dog.' },
      { id: 'p3', english: 'Fish', emoji: '🐟', phrase: 'This is a fish.' },
      { id: 'p4', english: 'Bird', emoji: '🐦', phrase: 'This is a bird.' },
      { id: 'p5', english: 'Rabbit', emoji: '🐰', phrase: 'This is a rabbit.' },
      { id: 'p6', english: 'Turtle', emoji: '🐢', phrase: 'This is a turtle.' }
    ]
  },
  unit2: {
    id: 'unit2',
    number: 2,
    name: 'Family',
    bigQuestion: 'Who Lives in Our Home?',
    description: 'Explore family members and loving moments!'
  }
};

/**
 * SECTION 5: STATE MANAGEMENT (Single Object + render())
 */
function createInitialState() {
  return {
    screen: 'home', // 'home' | 'unitOverview' | 'explore' | 'learnSpeak' | 'playHub' | 'game' | 'review' | 'completedHub' | 'quickReview'
    history: [],
    unit: {
      id: 'unit1',
      stages: [
        { id: 'explore', status: 'done', name: 'Explore' },
        { id: 'learn', status: 'current', name: 'Learn & Speak' },
        { id: 'play', status: 'locked', name: 'Practice & Play' },
        { id: 'review', status: 'locked', name: 'Review' }
      ],
      activityIdx: { explore: 1, learn: 3, play: 0, review: 0 }, // Demo seed: Learn Activity 3 of 4
      wordIdx: 4, // 5th word (Desk), dot shows 5 of 6
      quizIdx: 0,
      gamesDone: [false, false, false],
      unitDone: false,
      progressPct: 65,
      activitiesCompletedSinceSeed: 0 // remaining 9 activities
    },
    stars: 12,
    badges: [
      { id: 'b1', name: 'Explorer', icon: '🌟', earned: true },
      { id: 'b2', name: 'Word Master', icon: '🏅', earned: true },
      { id: 'b3', name: 'Super Hero', icon: '🏆', earned: false }
    ],
    paused: false,
    freeMode: null, // null | { from: 'completedHub' | 'unitOverview' }
    completedUnits: ['pets'],
    // Transient UI states
    exploreTapped: new Set(),
    activeGameType: 'listenChoose', // 'listenChoose' | 'findPicture' | 'whatsMissing'
    currentQuizQuestions: [],
    currentQuestionIndex: 0,
    quickReviewQuestions: [],
    quickReviewIndex: 0,
    quickReviewScore: 0,
    feedback: null, // { type: 'correct'|'wrong', msg: string }
    toast: null,
    showWelcomeModal: false,
    micListening: false
  };
}

let state = createInitialState();

/**
 * STAGE SCALER (Section 1 Hard Layout Rules)
 */
function updateStageScale() {
  const stage = document.getElementById('stage');
  const stageW = 1920;
  const stageH = 1080;
  const scale = Math.min(window.innerWidth / stageW, window.innerHeight / stageH);
  const left = Math.round((window.innerWidth - stageW * scale) / 2);
  const top = Math.round((window.innerHeight - stageH * scale) / 2);

  stage.style.transform = `scale(${scale})`;
  stage.style.left = `${left}px`;
  stage.style.top = `${top}px`;
}

window.addEventListener('resize', updateStageScale);
window.addEventListener('DOMContentLoaded', () => {
  updateStageScale();
  initApp();
});

/**
 * AUDIO / SPEECH UTILITY (Section 7)
 */
function speak(text) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.8;
      window.speechSynthesis.speak(utter);
    }
  } catch (e) {
    console.warn('Speech synthesis unavailable:', e);
  }
}

/**
 * PROGRESS RE-CALCULATION (Section 3: pct = 65 + 35 * (done / 9))
 */
function recordActivityCompletion() {
  if (state.unit.unitDone) return;
  state.unit.activitiesCompletedSinceSeed = Math.min(9, state.unit.activitiesCompletedSinceSeed + 1);
  state.unit.progressPct = Math.min(100, Math.round(65 + 35 * (state.unit.activitiesCompletedSinceSeed / 9)));
}

/**
 * ROUTING & ACTIONS
 */
function navigate(toScreen, params = {}) {
  state.history.push(state.screen);
  state.screen = toScreen;
  state.feedback = null;
  render();
}

function exitMidActivity() {
  state.paused = true;
  state.screen = 'home';
  showToast('Progress saved! See you soon 👋');
  render();
}

function handleContinueFromHome() {
  if (state.paused) {
    state.showWelcomeModal = true;
    render();
  } else {
    navigate('unitOverview');
  }
}

function resumeFromCheckpoint() {
  state.showWelcomeModal = false;
  state.paused = false;
  const currentStage = state.unit.stages.find(s => s.status === 'current') || state.unit.stages[0];
  if (currentStage.id === 'explore') navigate('explore');
  else if (currentStage.id === 'learn') navigate('learnSpeak');
  else if (currentStage.id === 'play') navigate('playHub');
  else if (currentStage.id === 'review') navigate('review');
  else navigate('unitOverview');
}

function showToast(msg) {
  const toastEl = document.getElementById('toast');
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  if (window._toastTimer) clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    toastEl.style.display = 'none';
  }, 2600);
}

/**
 * QUIZ GENERATOR (Section 4 & 6)
 */
function generateQuizQuestions(wordList, count = 3) {
  const pool = [...wordList];
  const questions = [];
  let lastCorrect = null;

  for (let i = 0; i < count; i++) {
    const available = pool.filter(w => w !== lastCorrect);
    const correct = available[Math.floor(Math.random() * available.length)];
    lastCorrect = correct;

    // Distractors
    const others = pool.filter(w => w.id !== correct.id);
    const shuffledOthers = others.sort(() => 0.5 - Math.random());
    const distractors = shuffledOthers.slice(0, 2);
    const options = [correct, ...distractors].sort(() => 0.5 - Math.random());

    questions.push({
      prompt: `Find the ${correct.english}`,
      audioText: correct.english,
      correctWord: correct,
      options
    });
  }
  return questions;
}

/**
 * RENDER ENGINE (Screens A through J)
 */
function render() {
  const header = document.getElementById('app-header');
  const content = document.getElementById('app-content');
  const footer = document.getElementById('app-footer');
  const modalRoot = document.getElementById('modal-root');

  header.innerHTML = '';
  content.innerHTML = '';
  footer.innerHTML = '';
  modalRoot.innerHTML = '';

  // HEADER (Consistent layout, min height 120, touch >= 96)
  renderHeader(header);

  // CONTENT
  switch (state.screen) {
    case 'home':
      renderHomeScreen(content);
      break;
    case 'unitOverview':
      renderUnitOverviewScreen(content);
      break;
    case 'explore':
      renderExploreScreen(content);
      break;
    case 'learnSpeak':
      renderLearnSpeakScreen(content);
      break;
    case 'playHub':
      renderPlayHubScreen(content);
      break;
    case 'game':
      renderGameScreen(content);
      break;
    case 'review':
      renderReviewScreen(content);
      break;
    case 'completedHub':
      renderCompletedHubScreen(content);
      break;
    case 'quickReview':
      renderQuickReviewScreen(content);
      break;
    default:
      renderHomeScreen(content);
  }

  // FOOTER
  renderFooter(footer);

  // MODAL OVERLAY (J. Welcome Back Modal)
  if (state.showWelcomeModal) {
    renderWelcomeBackModal(modalRoot);
  }
}

/**
 * HEADER COMPONENT
 */
function renderHeader(container) {
  const isMidActivity = ['explore', 'learnSpeak', 'game', 'quickReview'].includes(state.screen);

  container.innerHTML = `
    <div style="display:flex; align-items:center; gap:24px;">
      ${isMidActivity ? `
        <button class="btn btn-secondary btn-icon-sq" onclick="exitMidActivity()" aria-label="Exit Activity">✕</button>
      ` : state.screen !== 'home' ? `
        <button class="btn btn-secondary btn-icon-sq" onclick="navigate('home')" aria-label="Go Home">🏠</button>
      ` : `
        <div style="font-size:42px;">🌟</div>
      `}
      <div>
        <h2 style="font-size:36px; color:#2B2A4C; margin:0;">Little Steps English</h2>
      </div>
    </div>

    <!-- Center: Progress Bar for Activities / Quizzes -->
    ${isMidActivity ? `
      <div style="display:flex; align-items:center; gap:20px;">
        <span style="font-size:28px; font-weight:900; color:#4B44C9;">
          ${state.screen === 'learnSpeak' ? `Word ${state.unit.wordIdx + 1}/6` :
            state.screen === 'explore' ? `${state.exploreTapped.size}/4 Discovered` :
            state.screen === 'quickReview' ? `Item ${state.quickReviewIndex + 1}/5` : 'Playing Game'}
        </span>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${
            state.screen === 'learnSpeak' ? ((state.unit.wordIdx + 1) / 6 * 100) :
            state.screen === 'explore' ? (Math.min(100, (state.exploreTapped.size / 4) * 100)) :
            state.screen === 'quickReview' ? ((state.quickReviewIndex + 1) / 5 * 100) : 60
          }%;"></div>
        </div>
      </div>
    ` : `
      <div style="display:flex; align-items:center; gap:36px;">
        <div style="display:flex; align-items:center; gap:12px; font-size:32px; font-weight:800; color:#D97706;">
          <span>⭐</span> <span>${state.stars} Stars</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; font-size:32px; font-weight:800; color:#10B981;">
          <span>Unit 1:</span> <span>${state.unit.progressPct}%</span>
        </div>
      </div>
    `}

    <!-- Right: Goal or Helper -->
    <div style="display:flex; align-items:center; gap:16px;">
      <span style="font-size:28px; font-weight:800; color:#5E5D80; background:#EDF2F9; padding:10px 24px; border-radius:30px;">
        🎯 5 min today
      </span>
    </div>
  `;
}

/**
 * FOOTER COMPONENT
 */
function renderFooter(container) {
  // Fixed slot for feedback or actions
  let contentHtml = '';

  if (state.feedback) {
    const isCorr = state.feedback.type === 'correct';
    contentHtml = `
      <div class="feedback-slot">
        <div class="feedback-msg ${isCorr ? 'feedback-correct' : 'feedback-wrong'}">
          <span>${isCorr ? '🎉' : '💪'}</span>
          <span>${state.feedback.msg}</span>
        </div>
      </div>
    `;
  } else if (state.screen === 'explore') {
    const isDone = state.exploreTapped.size >= 4;
    contentHtml = `
      <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:30px; font-weight:800; color:#5E5D80;">
          ${isDone ? 'Great job! You discovered the classroom!' : 'Tap objects in the scene to hear English words.'}
        </span>
        ${isDone ? `
          <button class="btn btn-primary" onclick="completeExploreStage()">Continue to Learn & Speak ➔</button>
        ` : `
          <button class="btn btn-secondary" onclick="showToast('Tap at least 4 objects first! 😊')">Tap 4 objects</button>
        `}
      </div>
    `;
  } else if (state.screen === 'learnSpeak') {

function handleStageClick(stageId) {
  const target = state.unit.stages.find(s => s.id === stageId);

  if (target.status === 'locked') {

    speak('Finish the earlier steps first!');
    return;
  }
  if (stageId === 'explore') navigate('explore');
  else if (stageId === 'learn') navigate('learnSpeak');
  else if (stageId === 'play') navigate('playHub');
  else if (stageId === 'review') navigate('review');
}

function prevWord() {

    state.unit.wordIdx++;
    render();
  } else {

    launchRecognitionCheck();
  }
}

function simulateMic(word) {
  state.micListening = true;
  state.feedback = { type: 'correct', msg: 'Listening carefully… 🎧' };
  render();

  setTimeout(() => {
    state.micListening = false;
    state.feedback = { type: 'correct', msg: `Super pronunciation of "${word}"! ⭐` };
    speak(`Super pronunciation of ${word}!`);
    render();
    setTimeout(() => {
      state.feedback = null;
      render();
    }, 2000);
  }, 1500);
}

function skipMic() {
  state.feedback = { type: 'correct', msg: 'Great job! Moving forward! 🌟' };
  render();
  setTimeout(() => {

    render();
  }, 1200);

/**
 * SECTION 9: SELF-TEST & LAYOUT AUDIT (?debug=1)
 */
function runLayoutAudit() {
  const stage = document.getElementById('stage');
  const stageW = 1920;
  const stageH = 1080;
  const results = {
    noPageScroll: true,
    withinStageBounds: true,
    noOverflow: true,
    noOverlap: true,
    minFontSizePassed: true,
    touchTargetPassed: true,
    noScrollCss: true,
    errors: []
  };

  // 1. Page scroll check
  if (document.documentElement.scrollHeight > window.innerHeight || document.documentElement.scrollWidth > window.innerWidth) {
    results.noPageScroll = false;
    results.errors.push('Page scroll detected on body/documentElement');
  }

  // 6. Check for overflow: auto|scroll
  const allElements = stage.querySelectorAll('*');
  allElements.forEach(el => {
    const style = window.getComputedStyle(el);
    if (style.overflow === 'auto' || style.overflow === 'scroll' || 
        style.overflowX === 'auto' || style.overflowX === 'scroll' ||
        style.overflowY === 'auto' || style.overflowY === 'scroll') {
      results.noScrollCss = false;
      results.errors.push(`Element has overflow scroll/auto: ${el.tagName}.${el.className}`);
    }

    // 3. Check for physical overflow
    if (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2) {
      if (!['stage', 'app-content'].includes(el.id)) {
        results.noOverflow = false;
        results.errors.push(`Content overflow in ${el.tagName}.${el.className}`);
      }
    }

    // 5. Min font size >= 28px
    if (el.childNodes.length > 0) {
      for (let n of el.childNodes) {
        if (n.nodeType === Node.TEXT_NODE && n.nodeValue.trim().length > 0) {
          const fontSize = parseFloat(style.fontSize);
          if (fontSize < 27.5) { // allow micro-rounding
            results.minFontSizePassed = false;
            results.errors.push(`Font size ${fontSize}px < 28px in "${n.nodeValue.trim().substring(0,20)}"`);
            break;
          }
        }
      }
    }

    // 5. Touch target >= 96x96 for buttons and cards
    if (el.matches('button, [role=button], .card, .btn')) {
      const rect = el.getBoundingClientRect();
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      const stageElW = rect.width / scale;
      const stageElH = rect.height / scale;
      if (stageElW < 90 || stageElH < 90) { // allow minor rounding
        results.touchTargetPassed = false;
        results.errors.push(`Touch target < 96px in ${el.tagName}: ${Math.round(stageElW)}x${Math.round(stageElH)}`);
      }
    }
  });

  return results;
}

function runLayoutAuditCurrent() {
  const audit = runLayoutAudit();
  const resDiv = document.getElementById('debug-results');
  const isPass = audit.noPageScroll && audit.withinStageBounds && audit.noOverflow && audit.touchTargetPassed && audit.minFontSizePassed && audit.noScrollCss;

  resDiv.innerHTML = `
    <div style="margin-top:10px; padding:10px; background:${isPass ? '#064E3B' : '#7F1D1D'}; border-radius:8px;">
      <strong>Screen: ${state.screen}</strong> - ${isPass ? '<span class="badge-pass">ALL PASS</span>' : '<span class="badge-fail">FAIL</span>'}

    </div>
  `;
}

function runAllScreensAudit() {
  const screens = ['home', 'unitOverview', 'explore', 'learnSpeak', 'playHub', 'game', 'review', 'completedHub', 'quickReview'];
  const testResults = [];
  const origScreen = state.screen;

  screens.forEach(s => {
    state.screen = s;
    if (s === 'game') state.currentQuizQuestions = generateQuizQuestions(DATA.unit1.words, 3);
    if (s === 'quickReview') state.quickReviewQuestions = generateQuizQuestions(DATA.unit1.words, 5);
    render();
    const audit = runLayoutAudit();
    const isPass = audit.noPageScroll && audit.withinStageBounds && audit.noOverflow && audit.touchTargetPassed && audit.minFontSizePassed && audit.noScrollCss;
    testResults.push({ screen: s, pass: isPass, errors: audit.errors });
  });

  // Restore screen
  state.screen = origScreen;
  render();

  // Render Table
  const resDiv = document.getElementById('debug-results');
  let tableHtml = `
    <table id="debug-table">
      <thead>
        <tr><th>Screen</th><th>Result</th><th>Issues</th></tr>
      </thead>
      <tbody>
        ${testResults.map(r => `
          <tr>
            <td><strong>${r.screen}</strong></td>
            <td>${r.pass ? '<span class="badge-pass">PASS</span>' : '<span class="badge-fail">FAIL</span>'}</td>
            <td>${r.errors.length ? r.errors.join('; ') : 'None'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  resDiv.innerHTML = tableHtml;
}
