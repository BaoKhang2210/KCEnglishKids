name: Deploy to AWS EC2

on:
  push:
    branches:
      - client-learning_feature

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 🔍 Install dependencies & Validate Client Build
        run: |
          cd client
          npm ci
          npm run build

      - name: 🚀 Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== [1/4] Kéo mã nguồn mới nhất từ nhánh client-learning_feature ==="
            cd /var/www/kcenglishkids
            git fetch origin client-learning_feature
            git checkout client-learning_feature
            git pull origin client-learning_feature

            echo "=== [2/4] Cập nhật dependencies & Reload Backend (PM2) ==="
            cd /var/www/kcenglishkids/KCEnglishKids_BE
            npm install --omit=dev
            pm2 reload kcenglishkids-backend || pm2 start src/server.js --name "kcenglishkids-backend"
            pm2 save

            echo "=== [3/4] Cài đặt dependencies & Build Frontend ==="
            cd /var/www/kcenglishkids/client
            npm install
            npm run build

            echo "=== [4/4] Reload Web Server Nginx ==="
            sudo systemctl reload nginx

            echo "🎉 === DEPLOY THÀNH CÔNG LÊN EC2! ==="
