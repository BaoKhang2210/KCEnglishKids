name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            KCEnglishKids_BE/package-lock.json

      - name: Test Backend
        run: |
          cd KCEnglishKids_BE
          npm ci
          npm test --if-present

      - name: Type Check & Test Frontend
        run: |
          cd client
          npm ci
          npx tsc --noEmit
          npm run build

  deploy-to-ec2:
    name: Deploy to Amazon EC2
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "==> [1/5] Chuyển vào thư mục dự án..."
            cd /var/www/kcenglishkids

            echo "==> [2/5] Kéo code mới nhất từ nhánh main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> [3/5] Cập nhật Backend..."
            cd /var/www/kcenglishkids/KCEnglishKids_BE
            npm install --omit=dev
            # Reload tiến trình PM2 (Zero downtime), nếu chưa có thì khởi chạy mới
            pm2 reload kcenglishkids-backend || pm2 start src/server.js --name "kcenglishkids-backend"
            pm2 save

            echo "==> [4/5] Build Frontend..."
            cd /var/www/kcenglishkids/client
            npm install
            npm run build

            echo "==> [5/5] Reload Nginx..."
            sudo systemctl reload nginx

            echo "==> Hoàn tất Deploy ứng dụng lên AWS EC2 thành công!"
